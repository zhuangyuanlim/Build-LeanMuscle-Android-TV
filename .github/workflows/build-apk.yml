name: Build LeanMuscle Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Fix Directory Structure (自动修正文件夹层级)
        run: |
          # 如果拖拽上传时多套了一层文件夹，自动把里面的文件挪到根目录
          if [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Found project in $SUBDIR, moving to root..."
              mv "$SUBDIR"/* . 2>/dev/null || true
            fi
          fi
          ls -la

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 6. Setup Gradle 8.5 & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          arguments: assembleDebug --stacktrace

      - name: 7. Upload Ready-to-Install TV APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanMuscle-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
